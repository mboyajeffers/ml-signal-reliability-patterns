name: Daily Track Record

on:
  schedule:
    # 21:30 UTC = 4:30/5:30pm ET (DST-dependent) — after US market close
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python live/daily_predict.py
      - name: Commit track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live/track_record.jsonl model/model_registry.json
          git diff --cached --quiet || git commit -m "Daily track record: $(date -u +%Y-%m-%d)"
          git push
